<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peminjaman Alat Sekolah</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">
  <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-slate-800">Sistem Peminjaman Sarpras</h1>
      <p class="text-gray-500 text-sm">Fasilitas Penunjang Pembelajaran Sekolah</p>
    </div>

    <!-- Tab Navigasi -->
    <div class="flex border-b mb-6">
      <button id="tabPinjamBtn" onclick="switchTab('pinjam')" class="w-1/2 py-2 font-semibold text-blue-600 border-b-2 border-blue-600 transition">Pinjam Barang</button>
      <button id="tabKembaliBtn" onclick="switchTab('kembali')" class="w-1/2 py-2 font-semibold text-gray-500 hover:text-green-600 transition">Kembalikan Barang</button>
    </div>

    <!-- Loading Overlay -->
    <div id="loading" class="hidden text-center py-4">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent"></div>
      <p class="text-sm text-gray-600 mt-2">Memproses data...</p>
    </div>

    <!-- Alert / Status -->
    <div id="statusMessage" class="hidden mb-4 p-3 rounded-md text-sm font-semibold text-center"></div>

    <!-- Form Pinjam -->
    <form id="formPinjam" class="space-y-4" onsubmit="handlePinjam(event)">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
        <input type="text" id="namaPinjam" required placeholder="Contoh: Budi Santoso, S.Pd / Ahmad (X-IPA 1)" class="w-full rounded-md border-gray-300 border p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Peran</label>
        <select id="peranPinjam" class="w-full rounded-md border-gray-300 border p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="Guru">Guru</option>
          <option value="Siswa">Siswa</option>
          <option value="Staf / Karyawan">Staf / Karyawan</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Pilih Barang yang Tersedia</label>
        <select id="barangPinjam" required class="w-full rounded-md border-gray-300 border p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="">Memuat daftar barang...</option>
        </select>
      </div>
      <button type="submit" id="btnPinjamSubmit" class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-md hover:bg-blue-700 transition">Proses Peminjaman</button>
    </form>

    <!-- Form Pengembalian -->
    <form id="formKembali" class="space-y-4 hidden" onsubmit="handleKembali(event)">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Pilih Barang yang Dikembalikan</label>
        <select id="barangKembali" required class="w-full rounded-md border-gray-300 border p-2.5 focus:ring-2 focus:ring-green-500 outline-none">
          <option value="">Memuat barang dipinjam...</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Foto Bukti Pengembalian Fisik</label>
        <input type="file" id="fotoBukti" accept="image/*" capture="environment" required class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100 cursor-pointer border rounded-md p-1">
        <p class="text-xs text-gray-400 mt-1">*Di HP akan langsung membuka kamera belakang.</p>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Catatan Kondisi / Kelengkapan (Opsional)</label>
        <textarea id="catatan" class="w-full rounded-md border-gray-300 border p-2.5 focus:ring-2 focus:ring-green-500 outline-none" rows="2" placeholder="Contoh: Barang baik, remote & kabel lengkap"></textarea>
      </div>
      <button type="submit" id="btnKembaliSubmit" class="w-full bg-green-600 text-white font-medium py-2.5 rounded-md hover:bg-green-700 transition">Proses Pengembalian</button>
    </form>
  </div>

  <script>
    // MASUKKAN URL DEPLOYMENT GOOGLE APPS SCRIPT ANDA DI DI SINI
    const API_URL = "https://script.google.com/macros/s/AKfycbziucoWMZsD4M2j3RQscoGOwuhtNSdil4BxS8c5_ov1JQx-wSVAsr7xRlTtqVBkt15k/exec"; 

    let listBarang = [];

    async function loadData() {
      showLoading(true);
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ action: "getBarang" })
        });
        const result = await res.json();
        if (result.status === "success") {
          listBarang = result.data;
          renderSelects();
        } else {
          showStatus("Gagal mengambil data barang.", true);
        }
      } catch (e) {
        showStatus("Koneksi gagal / URL API belum diatur.", true);
      } finally {
        showLoading(false);
      }
    }

    function renderSelects() {
      const selectPinjam = document.getElementById("barangPinjam");
      const selectKembali = document.getElementById("barangKembali");

      selectPinjam.innerHTML = '<option value="">-- Pilih Barang Tersedia --</option>';
      selectKembali.innerHTML = '<option value="">-- Pilih Barang Dipinjam --</option>';

      let adaTersedia = false;
      let adaDipinjam = false;

      listBarang.forEach(b => {
        if (b.status === "Tersedia") {
          selectPinjam.innerHTML += `<option value="${b.nama}">${b.nama}</option>`;
          adaTersedia = true;
        } else if (b.status === "Dipinjam") {
          selectKembali.innerHTML += `<option value="${b.nama}">${b.nama}</option>`;
          adaDipinjam = true;
        }
      });

      if (!adaTersedia) selectPinjam.innerHTML = '<option value="">Tidak ada barang tersedia</option>';
      if (!adaDipinjam) selectKembali.innerHTML = '<option value="">Tidak ada barang yang sedang dipinjam</option>';
    }

    function switchTab(tab) {
      hideStatus();
      if (tab === 'pinjam') {
        document.getElementById("formPinjam").classList.remove("hidden");
        document.getElementById("formKembali").classList.add("hidden");
        document.getElementById("tabPinjamBtn").className = "w-1/2 py-2 font-semibold text-blue-600 border-b-2 border-blue-600 transition";
        document.getElementById("tabKembaliBtn").className = "w-1/2 py-2 font-semibold text-gray-500 hover:text-green-600 transition";
      } else {
        document.getElementById("formPinjam").classList.add("hidden");
        document.getElementById("formKembali").classList.remove("hidden");
        document.getElementById("tabKembaliBtn").className = "w-1/2 py-2 font-semibold text-green-600 border-b-2 border-green-600 transition";
        document.getElementById("tabPinjamBtn").className = "w-1/2 py-2 font-semibold text-gray-500 hover:text-blue-600 transition";
      }
    }

    async function handlePinjam(e) {
      e.preventDefault();
      const nama = document.getElementById("namaPinjam").value.trim();
      const peran = document.getElementById("peranPinjam").value;
      const barang = document.getElementById("barangPinjam").value;

      if (!barang) {
        showStatus("Pilih barang yang ingin dipinjam!", true);
        return;
      }

      showLoading(true);
      hideStatus();

      try {
        const payload = { action: "pinjamBarang", nama, peran, namaBarang: barang };
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        
        if (result.status === "success") {
          showStatus("✅ " + result.message, false);
          document.getElementById("formPinjam").reset();
          await loadData();
        } else {
          showStatus("❌ " + result.message, true);
        }
      } catch (err) {
        showStatus("❌ Terjadi kesalahan jaringan.", true);
      } finally {
        showLoading(false);
      }
    }

    async function handleKembali(e) {
      e.preventDefault();
      const barang = document.getElementById("barangKembali").value;
      const catatan = document.getElementById("catatan").value;
      const fileInput = document.getElementById("fotoBukti");

      if (!barang) {
        showStatus("Pilih barang yang akan dikembalikan!", true);
        return;
      }

      if (!fileInput.files || fileInput.files.length === 0) {
        showStatus("Ambil / Upload foto bukti fisik pengembalian!", true);
        return;
      }

      showLoading(true);
      hideStatus();

      const reader = new FileReader();
      reader.onload = async function() {
        try {
          const payload = {
            action: "kembalikanBarang",
            namaBarang: barang,
            catatan: catatan,
            imageData: reader.result
          };

          const res = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(payload)
          });
          const result = await res.json();

          if (result.status === "success") {
            showStatus("✅ " + result.message, false);
            document.getElementById("formKembali").reset();
            await loadData();
          } else {
            showStatus("❌ " + result.message, true);
          }
        } catch (err) {
          showStatus("❌ Terjadi kesalahan pengiriman foto.", true);
        } finally {
          showLoading(false);
        }
      };

      reader.readAsDataURL(fileInput.files[0]);
    }

    function showLoading(show) {
      document.getElementById("loading").classList.toggle("hidden", !show);
      document.getElementById("btnPinjamSubmit").disabled = show;
      document.getElementById("btnKembaliSubmit").disabled = show;
    }

    function showStatus(msg, isError) {
      const el = document.getElementById("statusMessage");
      el.innerText = msg;
      el.className = `mb-4 p-3 rounded-md text-sm font-semibold text-center ${isError ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;
      el.classList.remove("hidden");
    }

    function hideStatus() {
      document.getElementById("statusMessage").classList.add("hidden");
    }

    // Inisialisasi
    loadData();
  </script>
</body>
</html>
